[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-abacus"
version = "0.3.0.dev0"
description = "High-precision calculator MCP server: arithmetic plus calculus — derivatives, integrals, and equation solving — evaluated in fixed-point, IEEE-754 floating-point, or exact rational mode, with every result labelled exact or inexact."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "László Pere", email = "226979892+laszlopere@users.noreply.github.com" },
]
keywords = ["mcp", "calculator", "arithmetic", "math", "calculus", "derivative", "integral", "solver", "equation", "high-precision", "decimal", "ieee-754", "fixed-point", "rational"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mcp-abacus = "mcp_abacus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_abacus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
